<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twitter Clone</title>
  <style>
    :root { --line:#2f3336; --blue:#1d9bf0; --dim:#71767b; }
    body {
      background:#000; color:#e7e9ea;
      font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
      max-width:600px; margin:0 auto; padding:0 16px 80px;
    }
    h1 { font-size:22px; padding:12px 0; border-bottom:1px solid var(--line); }
    h3 { font-size:15px; color:var(--dim); margin:20px 0 8px; }
    hr { display:none; }
    /* ボタン：青いピル */
    button {
      background:var(--blue); color:#fff; border:none; border-radius:9999px;
      padding:8px 16px; font-weight:bold; font-size:14px; cursor:pointer;
    }
    button:hover { opacity:.9; }
    /* 入力欄：ダーク */
    input, textarea {
      background:#000; color:#e7e9ea; border:1px solid var(--line);
      border-radius:8px; padding:10px; font-size:15px; margin:4px 0;
    }
    textarea { width:100%; box-sizing:border-box; }
    label { color:var(--dim); font-size:14px; }
    p { color:var(--dim); font-size:14px; word-break:break-all; }
    /* タイムライン：カード行 */
    ul { list-style:none; padding:0; margin:0; }
    #homeTimeline li, #userList li, #myTweets li {
      border-bottom:1px solid var(--line); padding:12px 2px;
      display:flex; align-items:center; gap:10px; font-size:15px; line-height:1.4;
    }
    #timeline li { border-bottom:1px solid var(--line); padding:12px 2px; font-size:15px; line-height:1.4; }
    .tweet-main { display:flex; align-items:flex-start; gap:10px; }
    .tweet-actions { display:flex; gap:10px; margin:8px 0 0 46px; }
    .cmt-area { margin:8px 0 0 46px; }
    .cmt-item { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; border-bottom:1px solid var(--line); }
    .cmt-avatar { width:28px; height:28px; }
    #userProfileCard { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; }
    #userTweets li { border-bottom:1px solid var(--line); padding:12px 2px; font-size:15px; }
    #userBack { color:var(--blue); text-decoration:none; display:inline-block; margin:8px 0; }
    #deleteDataBtn { background:#f4212e; margin-top:16px; }
    .cmt-input { display:flex; gap:6px; margin-top:8px; }
    .cmt-input input { flex:1; }
    /* 行内の小さいボタン（削除）は控えめに */
    #timeline li button, #homeTimeline li button, #userList li button, #myTweets li button {
      background:transparent; color:var(--dim); border:1px solid var(--line);
      border-radius:9999px; padding:2px 10px; font-size:12px; font-weight:normal;
    }
    #myTweets li button { margin-left:auto; }
    #userList li button.follow { margin-left:auto; background:var(--blue); color:#fff; border:none; }
    .avatar { width:36px; height:36px; border-radius:9999px; background:#16181c; flex:none; }
    #profileCard { display:flex; gap:12px; align-items:flex-start; border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; }
    #profileCard #myAvatar { width:56px; height:56px; }
    #profileCard .fields { flex:1; }
    #profileCard input, #profileCard textarea { width:100%; box-sizing:border-box; display:block; }
    #nav { display:none; gap:18px; border-bottom:1px solid var(--line); padding:10px 0; margin:8px 0 12px; position:sticky; top:0; background:#000; z-index:1; }
    #nav a { color:var(--dim); text-decoration:none; font-weight:bold; font-size:15px; }
    #nav a.active { color:var(--blue); }
    .view { display:none; }   /* 既定は非表示。JSが現在のビューだけ表示する（読み込み中の漏れ防止） */
    #logoutBtn { display:none; }   /* 既定（未ログイン）は出さない。ログイン時にJSで表示 */
    #logoutDialog { background:#000; color:#e7e9ea; border:1px solid var(--line); border-radius:16px; padding:24px; width:300px; max-width:90vw; }
    #logoutDialog::backdrop { background:rgba(91,112,131,.4); }
    #logoutDialog h3 { margin:0 0 6px; font-size:18px; }
    #logoutDialog p { color:var(--dim); margin:0 0 20px; }
    #logoutDialog .dialog-actions { display:flex; flex-direction:column; gap:10px; }
    #logoutDialog .dialog-actions button { width:100%; padding:10px; }
    #logoutConfirm { background:#fff; color:#000; }
    #logoutCancel { background:transparent; color:#e7e9ea; border:1px solid var(--line); }
    /* AIチャット（Grok風） */
    #grokConvList { display:flex; gap:8px; overflow-x:auto; padding:4px 0; }
    #grokConvList button { background:transparent; color:var(--dim); border:1px solid var(--line); border-radius:9999px; padding:4px 12px; font-size:13px; font-weight:normal; white-space:nowrap; }
    #grokConvList button.active { color:var(--blue); border-color:var(--blue); }
    #grokLog { margin:8px 0; min-height:120px; }
    .grok-msg { padding:10px 14px; border-radius:16px; margin:8px 0; max-width:85%; line-height:1.5; font-size:15px; white-space:pre-wrap; word-break:break-word; }
    .grok-user { background:var(--blue); color:#fff; margin-left:auto; }
    .grok-ai { background:#16181c; color:#e7e9ea; }
    .grok-input { display:flex; gap:8px; align-items:flex-end; position:sticky; bottom:0; background:#000; padding:8px 0; }
    .grok-input textarea { flex:1; margin:0; }
    #grokMeta { font-size:12px; }
    /* AI機能（作文アシスト・要約） */
    .ai-tools { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
    .ai-tools button, #summarizeTlBtn, .ai-btn {
      background:transparent; color:var(--blue); border:1px solid var(--blue);
      border-radius:9999px; padding:4px 12px; font-size:13px; font-weight:normal;
    }
    .ai-tools button:disabled, #summarizeTlBtn:disabled, .ai-btn:disabled { opacity:.5; cursor:default; }
    #summarizeTlBtn { margin:6px 0; }
    .ai-box { display:none; white-space:pre-wrap; line-height:1.5; font-size:14px;
      background:#16181c; border:1px solid var(--line); border-radius:12px; padding:12px; margin:8px 0; }
  </style>
</head>
<body>
  <h1>ミニTwitter</h1>

  <!-- ヘッダー：ログイン状態 -->
  <p id="status">未ログイン</p>
  <button id="loginBtn">Googleでログイン</button>
  <button id="logoutBtn">ログアウト</button>

  <!-- ナビ（ハッシュで画面切替） -->
  <nav id="nav">
    <a href="#home">ホーム</a>
    <a href="#explore">さがす</a>
    <a href="#grok">AI</a>
    <a href="#profile">プロフィール</a>
  </nav>

  <p id="gate">🔒 ログインすると使えます。上の「Googleでログイン」を押してください。</p>

  <!-- ログアウト確認モーダル（X風・自作 dialog） -->
  <dialog id="logoutDialog">
    <h3>ログアウトしますか？</h3>
    <p>いつでもまたログインできます。</p>
    <div class="dialog-actions">
      <button id="logoutConfirm">ログアウト</button>
      <button id="logoutCancel">キャンセル</button>
    </div>
  </dialog>

  <!-- ===== ホーム ===== -->
  <section id="view-home" class="view">
    <textarea id="tweetBody" placeholder="いまどうしてる？" rows="3"></textarea><br />
    <button id="postBtn">ポスト</button>
    <label><input type="checkbox" id="isDraft" /> 下書き（自分だけ）</label>
    <!-- 機能2: 投稿の下書きAI（入力欄の文章を書き換える） -->
    <div id="composeAi" class="ai-tools">
      <button type="button" data-ai="polish">AIで整える</button>
      <button type="button" data-ai="continue">続きを書く</button>
      <button type="button" data-ai="shorten">短く</button>
      <button type="button" data-ai="hashtags">ハッシュタグ</button>
    </div>
    <!-- 機能1: タイムライン要約「今北産業」 -->
    <button id="summarizeTlBtn" type="button">🧵 タイムラインを3行で要約</button>
    <div id="tlSummary" class="ai-box"></div>
    <ul id="timeline"></ul>
    <h3>ホームタイムライン（フォロー中の人だけ）</h3>
    <button id="loadHomeBtn">ホームを更新</button>
    <ul id="homeTimeline"></ul>
  </section>

  <!-- ===== さがす ===== -->
  <section id="view-explore" class="view">
    <h3>ユーザーを探す</h3>
    <input id="searchInput" placeholder="ユーザーを検索（名前・ひとこと）" />
    <button id="searchBtn">検索</button>
    <ul id="userList"></ul>
  </section>

  <!-- ===== プロフィール（マイページ） ===== -->
  <section id="view-profile" class="view">
    <h3>プロフィール</h3>
    <div id="profileCard">
      <img id="myAvatar" class="avatar" alt="" />
      <div class="fields">
        <input id="displayName" placeholder="表示名" />
        <textarea id="bioInput" placeholder="ひとこと（自己紹介）" rows="2"></textarea>
        <label class="avatarUpload">アバター画像: <input type="file" id="avatarInput" accept="image/*" /></label>
        <button id="saveProfileBtn">プロフィールを更新</button>
      </div>
    </div>
    <h3>自分の投稿（下書き含む）</h3>
    <ul id="myTweets"></ul>
    <button id="deleteDataBtn">⚠️ 自分のデータを消す</button>
  </section>

  <!-- ===== ユーザー（他人のプロフィール） ===== -->
  <section id="view-user" class="view">
    <a href="#home" id="userBack">← ホームへ</a>
    <div id="userProfileCard"></div>
    <div id="userAiSummary" class="ai-box"></div>
    <h3>投稿</h3>
    <ul id="userTweets"></ul>
  </section>

  <!-- ===== AI（Grok風・AIと会話） ===== -->
  <section id="view-grok" class="view">
    <h3>AI と会話する</h3>
    <div id="grokConvList"></div>
    <button id="grokNew">＋ 新しい会話</button>
    <div id="grokLog"></div>
    <div class="grok-input">
      <textarea id="grokInput" placeholder="AIに聞いてみる…" rows="2"></textarea>
      <button id="grokSend">送信</button>
    </div>
    <p id="grokMeta"></p>
  </section>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    // ★1: あなたの Project URL（合っているか確認）
    const SUPABASE_URL = 'https://kogxknhdvgencyyntbru.supabase.co';
    // ★2: あなたの anon key（eyJ... の長い文字列）に置きかえる
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvZ3hrbmhkdmdlbmN5eW50YnJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0OTg0MTMsImV4cCI6MjA5ODA3NDQxM30.JlF0E1uOKF9SEepvCNv1dXqUfw9U41jgmZl6xBNk4NE';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- N1: ハッシュで画面切替（SPAルーティング） ---
    const VIEWS = ['home', 'explore', 'profile', 'grok'];
    const ALL_VIEWS = ['home', 'explore', 'profile', 'user', 'grok'];
    function showView() {
      const hash = location.hash || '#home';
      // #user/<id> ＝ 他人のプロフィール画面
      if (hash.startsWith('#user/')) {
        const uid = hash.slice('#user/'.length);
        for (const v of ALL_VIEWS) document.getElementById('view-' + v).style.display = (v === 'user') ? 'block' : 'none';
        document.querySelectorAll('#nav a').forEach((a) => a.classList.remove('active'));
        loadUserProfile(uid);
        return;
      }
      const cur = hash.replace('#', '');
      const name = VIEWS.includes(cur) ? cur : 'home';
      for (const v of ALL_VIEWS) {
        document.getElementById('view-' + v).style.display = (v === name) ? 'block' : 'none';
      }
      document.querySelectorAll('#nav a').forEach((a) => {
        a.classList.toggle('active', a.getAttribute('href') === '#' + name);
      });
      if (name === 'grok') grokInit();   // AIページを開いたら初期化（1回だけ）
    }
    // ログインしている時だけアプリ本体を表示。未ログインはログイン案内だけ
    function applyAuthGate(loggedIn) {
      document.getElementById('loginBtn').style.display = loggedIn ? 'none' : 'inline-block';   // ログイン中は出さない
      document.getElementById('logoutBtn').style.display = loggedIn ? 'inline-block' : 'none';  // ログイン前は出さない
      document.getElementById('nav').style.display = loggedIn ? 'flex' : 'none';
      document.getElementById('gate').style.display = loggedIn ? 'none' : 'block';
      if (loggedIn) { showView(); }
      else { for (const v of VIEWS) document.getElementById('view-' + v).style.display = 'none'; }
    }
    window.addEventListener('hashchange', () => {
      if (document.getElementById('nav').style.display !== 'none') showView();
    });

    // クリックでそのユーザーのプロフィールへ飛べるアバターを作る
    function avatarEl(userId, url) {
      const img = document.createElement('img');
      img.className = 'avatar';
      img.src = avatarSrc(userId, url);
      img.style.cursor = 'pointer';
      img.title = 'プロフィールを見る';
      img.addEventListener('click', () => { location.hash = '#user/' + userId; });
      return img;
    }

    // 他人（または自分）のプロフィール画面を表示
    async function loadUserProfile(uid) {
      const card = document.getElementById('userProfileCard');
      const list = document.getElementById('userTweets');
      card.innerHTML = ''; list.innerHTML = '';
      const { data: p } = await supabase.from('profiles')
        .select('id, display_name, bio, avatar_url').eq('id', uid).single();
      const av = document.createElement('img');
      av.className = 'avatar'; av.style.width = '56px'; av.style.height = '56px';
      av.src = avatarSrc(uid, p && p.avatar_url);
      const info = document.createElement('div'); info.style.flex = '1';
      const nm = document.createElement('div'); nm.style.fontWeight = 'bold'; nm.style.fontSize = '18px';
      nm.textContent = (p && p.display_name) || '名無し';
      const bio = document.createElement('div'); bio.style.color = 'var(--dim)';
      bio.textContent = (p && p.bio) || '';
      info.append(nm, bio);
      // 自分以外ならフォロー/解除ボタン
      if (myUserId && uid !== myUserId) {
        const { data: f } = await supabase.from('follows')
          .select('followee_id').eq('follower_id', myUserId).eq('followee_id', uid);
        const isFollowing = !!(f && f.length);
        const fb = document.createElement('button');
        fb.style.marginTop = '8px';
        fb.textContent = isFollowing ? 'フォロー中' : 'フォロー';
        fb.addEventListener('click', async () => {
          if (isFollowing) {
            if (!confirm('フォロー解除しますか？')) return;
            await supabase.from('follows').delete().eq('followee_id', uid);
          } else {
            await supabase.from('follows').insert({ followee_id: uid });
          }
          await loadUserProfile(uid);
          await loadHome();
          await loadUsers();
        });
        info.appendChild(fb);
      }
      card.append(av, info);
      // その人の公開投稿
      const { data: ts } = await supabase.from('tweets')
        .select('*').eq('user_id', uid).eq('is_public', true).order('created_at', { ascending: false });
      for (const t of (ts || [])) {
        const li = document.createElement('li');
        li.textContent = t.body;
        list.appendChild(li);
      }
      // 機能4: 「この人ってどんな人？」AIで人物像を要約
      const aiBox = document.getElementById('userAiSummary');
      aiBox.style.display = 'none'; aiBox.textContent = '';
      if (ts && ts.length) {
        const sumBtn = document.createElement('button');
        sumBtn.className = 'ai-btn'; sumBtn.style.marginTop = '8px';
        sumBtn.textContent = '🤖 この人ってどんな人？';
        sumBtn.addEventListener('click', () => aiRun(sumBtn, aiBox, '読んでいます', () => aiComplete(
          'あなたは人物紹介の書き手です。SNSの投稿から、その人の興味や人柄を正直に、あたたかく2〜3行で。決めつけすぎず、投稿にある事実に基づいて書いてください。',
          nm.textContent + ' さんの投稿:\n' + ts.map((t) => '・' + t.body).join('\n'))));
        info.appendChild(sumBtn);
      }
    }

    const loginBtn = document.getElementById('loginBtn');
    const status = document.getElementById('status');

    // ▼▼▼ ここだけ田沼さんが書いた ▼▼▼
    loginBtn.addEventListener('click', async () => {
      await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname },
      });
    });
    // ▲▲▲

    // ログアウト：セッションを消して再読み込み
    const logoutBtn = document.getElementById('logoutBtn');
    const logoutDialog = document.getElementById('logoutDialog');
    logoutBtn.addEventListener('click', () => logoutDialog.showModal());            // モーダルを開く
    document.getElementById('logoutCancel').addEventListener('click', () => logoutDialog.close());
    document.getElementById('logoutConfirm').addEventListener('click', async () => {
      await supabase.auth.signOut();
      location.reload();
    });

    // ページを開いた時：すでにログイン済みか確認して表示
    const { data: { user } } = await supabase.auth.getUser();
    const myUserId = user ? user.id : null;   // 自分のID（持ち主判定に使う）
    if (user) status.textContent = 'ログイン中';
    applyAuthGate(!!myUserId);   // ログイン状態でアプリ表示/ログイン案内を切替

    // --- X1/P: プロフィール（表示名・ひとこと・アバターを1か所で）---
    const displayNameInput = document.getElementById('displayName');
    const bioInput = document.getElementById('bioInput');
    const saveProfileBtn = document.getElementById('saveProfileBtn');
    const myAvatar = document.getElementById('myAvatar');
    myAvatar.src = avatarSrc(myUserId || 'guest', null); // 初期は自動生成

    if (myUserId) {
      // プロフィールが無ければ作る（既定名＝メールの@より前）。あれば上書きしない
      const defaultName = 'パン仲間' + Math.floor(1000 + Math.random() * 9000); // メール名を出さず無難な自動名
      await supabase.from('profiles')
        .upsert({ id: myUserId, display_name: defaultName }, { onConflict: 'id', ignoreDuplicates: true });
      // 今のプロフィールをカードに反映（メアドは画面に出さない）
      const { data: me } = await supabase.from('profiles')
        .select('display_name, bio, avatar_url').eq('id', myUserId).single();
      if (me) {
        displayNameInput.value = me.display_name || '';
        bioInput.value = me.bio || '';
        myAvatar.src = avatarSrc(myUserId, me.avatar_url);
        status.textContent = 'ログイン中: @' + me.display_name;
      }
    }

    // プロフィール更新（表示名＋ひとこと。自分の分だけ・RLSが守る）
    saveProfileBtn.addEventListener('click', async () => {
      if (!myUserId) return;
      const name = displayNameInput.value.trim();
      if (!name) { alert('表示名を入れてください'); return; }
      const { error } = await supabase.from('profiles')
        .update({ display_name: name, bio: bioInput.value.trim() }).eq('id', myUserId);
      if (error) { alert('保存に失敗: ' + error.message); return; }
      status.textContent = 'ログイン中: @' + name;
      alert('プロフィールを更新しました');
      await loadTweets();
      await loadHome();
      await loadUsers();
    });

    // --- データ削除（自分の足跡を全部消す）---
    document.getElementById('deleteDataBtn').addEventListener('click', async () => {
      if (!myUserId) return;
      if (!confirm('あなたのプロフィール・投稿・いいね・コメント・フォローを全部消します。よろしいですか？')) return;
      await supabase.from('likes').delete().eq('user_id', myUserId);
      await supabase.from('comments').delete().eq('user_id', myUserId);
      await supabase.from('follows').delete().eq('follower_id', myUserId);
      await supabase.from('tweets').delete().eq('user_id', myUserId);   // 自分の投稿（紐づくいいね/コメントもcascadeで消える）
      await supabase.from('profiles').delete().eq('id', myUserId);
      await supabase.auth.signOut();
      alert('データを消してログアウトしました');
      location.reload();
    });

    // --- A2: アバター画像をアップロード ---
    const avatarInput = document.getElementById('avatarInput');
    avatarInput.addEventListener('change', async () => {
      const file = avatarInput.files[0];
      if (!file || !myUserId) return;
      const path = myUserId + '/' + Date.now() + '_' + file.name; // 保存先（重複しない名前）

      const bucket = 'avatars'; // 👈 田沼さんの手番：作ったバケット名に直す

      // ① avatars バケットにアップロード
      const { error: upErr } = await supabase.storage.from(bucket).upload(path, file);
      if (upErr) { alert('アップロード失敗: ' + upErr.message); return; }

      // ② 公開URLを取り出して profiles に保存
      const { data: pub } = supabase.storage.from(bucket).getPublicUrl(path);
      const { error: dbErr } = await supabase.from('profiles')
        .update({ avatar_url: pub.publicUrl }).eq('id', myUserId);
      if (dbErr) { alert('保存に失敗: ' + dbErr.message); return; }

      myAvatar.src = pub.publicUrl;   // プロフィールカードのプレビューも更新
      await loadTweets(); await loadUsers(); await loadHome();
      alert('アバターを更新しました');
    });

    // --- Phase 3: ツイートの保存と表示 ---
    const tweetBody = document.getElementById('tweetBody');
    const postBtn = document.getElementById('postBtn');
    const timeline = document.getElementById('timeline');

    // アバターURL：登録済みならそれ、無ければ自動生成(DiceBear)
    function avatarSrc(id, url) {
      return url || ('https://api.dicebear.com/9.x/identicon/svg?seed=' + encodeURIComponent(id));
    }

    // 表示名＋アバターURLを「1回のクエリ」でまとめて取る（N+1回避）
    async function fetchNames(userIds) {
      const uniq = [...new Set(userIds)];
      if (uniq.length === 0) return {};
      const { data, error } = await supabase
        .from('profiles')
        .select('id, display_name, avatar_url')
        .in('id', uniq);
      if (error) { console.error(error); return {}; }
      const map = {};
      for (const p of data) map[p.id] = { name: p.display_name, avatar: p.avatar_url };
      return map;
    }

    // いいねを「1回のクエリ」でまとめて取る（N+1回避）
    async function fetchLikes(tweetIds) {
      const uniq = [...new Set(tweetIds)];
      if (uniq.length === 0) return [];
      const { data, error } = await supabase
        .from('likes')
        .select('tweet_id, user_id')
        .in('tweet_id', uniq);
      if (error) { console.error(error); return []; }
      return data;
    }

    // ❤️いいねのトグル（押す=insert / もう一度押す=delete）
    async function toggleLike(tweetId, liked) {
      if (!myUserId) { alert('ログインしてね'); return; }
      if (liked) {
        const { error } = await supabase.from('likes').delete().eq('tweet_id', tweetId); // RLSで自分の分だけ
        if (error) { alert('失敗: ' + error.message); return; }
      } else {
        const { error } = await supabase.from('likes').insert({ tweet_id: tweetId });     // user_idは自動で自分
        if (error) { alert('失敗: ' + error.message); return; }
      }
      await loadTweets();
    }

    // コメント数を「1回」でまとめて取る（N+1回避）
    async function fetchCommentCounts(tweetIds) {
      const uniq = [...new Set(tweetIds)];
      if (uniq.length === 0) return {};
      const { data, error } = await supabase.from('comments').select('tweet_id').in('tweet_id', uniq);
      if (error) { console.error(error); return {}; }
      const map = {};
      for (const r of data) map[r.tweet_id] = (map[r.tweet_id] || 0) + 1;
      return map;
    }

    // ある投稿のコメント一覧＋入力欄を描く
    async function renderComments(tweetId, container) {
      container.innerHTML = '読み込み中…';

        .select('*').eq('tweet_id', tweetId).order('created_at', { ascending: true });

      for (const c of (cs || [])) {

        item.className = 'cmt-item';

        const av = avatarEl(c.user_id, cp && cp.avatar);
        av.classList.add('cmt-avatar');
        const sp = document.createElement('span');
        sp.textContent = ((cp && cp.name) || '名無し') + '：' + c.body;
        item.append(av, sp);
        container.appendChild(item);
      }
      const input = document.createElement('input');
      input.placeholder = 'コメントを書く…';
      const send = document.createElement('button');
      send.textContent = '送信';
      send.addEventListener('click', async () => {
        const body = input.value.trim();
        if (!body || !myUserId) return;
        const { error } = await supabase.from('comments').insert({ tweet_id: tweetId, body });
        if (error) { alert('失敗: ' + error.message); return; }
        input.value = '';
        await renderComments(tweetId, container);  // 一覧を更新（コメント欄は開いたまま）
      });
      const wrap = document.createElement('div');
      wrap.className = 'cmt-input';
      wrap.append(input, send);
      container.appendChild(wrap);
    }

    // 【読む】一覧を新しい順で取り出して画面に並べる
    async function loadTweets() {
      const { data, error } = await supabase
        .from('tweets')
        .select('*')

      const names = await fetchNames(data.map((t) => t.user_id));

      const likeRows = await fetchLikes(data.map((t) => t.id));
      const likeCount = {}; const iLiked = new Set();
      for (const r of likeRows) {

        // 削除ボタンは「自分の投稿」にだけ表示（本当の防御はRLS）
        if (t.user_id === myUserId) {

    // 【書く】ポストを押したら保存して、一覧を更新

    // --- 第7章/X4b: ユーザー一覧からフォロー ---
    const userList = document.getElementById('userList');

    // 登録ユーザーを一覧表示（アイコン＋名前＋フォロー/解除ボタン）
    async function loadUsers(query = '') {

    // --- 第8章: ホームタイムライン（2つの表をまたぐ） ---

    // 自分の投稿（下書き含む）をマイページに表示
    const myTweets = document.getElementById('myTweets');
    async function loadMyTweets() {

    // ===== AIチャット（Grok風）: 今日作ったサーバー(/api/chat)を呼ぶ =====
    const GROK_SERVER = 'https://mini-chatgpt-clone.onrender.com';   // Renderにデプロイした本番サーバー
    const GROK_BASE_SYSTEM = 'あなたは親切で、やさしい日本語で答えるアシスタントです。';
    const GROK_RECENT = 4;                          // 直近で何件そのまま渡すか
    let grokHistory = [{ role: 'system', content: GROK_BASE_SYSTEM }];
    let grokConvId = null;
    let grokSummary = '';
    let grokSummarizedCount = 0;
    let grokMemory = [];
    let grokSending = false;
    let grokInited = false;

    async function grokToken() {
      const { data } = await supabase.auth.getSession();
      return data.session ? data.session.access_token : null;
    }
    function grokBuildSystem() {
      let content = GROK_BASE_SYSTEM;
      if (grokMemory.length) content += '\n【ユーザーについて】\n' + grokMemory.map((f) => '- ' + f).join('\n');
      return { role: 'system', content };
    }
    function grokBuildMessages() {
      const rest = grokHistory.slice(1);
      const recent = rest.slice(-GROK_RECENT);
      const msgs = [grokBuildSystem()];
      if (grokSummary) msgs.push({ role: 'system', content: 'これまでの会話の要約:\n' + grokSummary });
      msgs.push(...recent);
      return msgs;
    }
    function grokRender() {
      const log = document.getElementById('grokLog');
      log.innerHTML = '';
      for (const m of grokHistory) {
        if (m.role === 'system') continue;
        const div = document.createElement('div');
        div.className = 'grok-msg ' + (m.role === 'user' ? 'grok-user' : 'grok-ai');
        div.textContent = m.content;
        log.appendChild(div);
      }
      log.scrollTop = log.scrollHeight;
      document.getElementById('grokMeta').textContent =
        '覚えている事実: ' + grokMemory.length + '件 ／ 要約に畳んだ発言: ' + grokSummarizedCount + '件';
    }

    async function grokSend(text) {
      if (grokSending || !text.trim()) return;
      grokSending = true;
      document.getElementById('grokSend').disabled = true;
      try {
        grokHistory.push({ role: 'user', content: text });
        grokRender();
        const token = await grokToken();
        const res = await fetch(GROK_SERVER + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ messages: grokBuildMessages() }),
        });
        if (!res.ok) {
          let msg = 'エラー';
          try { msg = (await res.json()).error || msg; } catch (e) {}
          grokHistory.push({ role: 'assistant', content: '⚠ ' + msg });
          grokRender();
          return;
        }
        grokHistory.push({ role: 'assistant', content: '' });
        const aiMsg = grokHistory[grokHistory.length - 1];
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const payload = line.slice(6);
            if (payload === '[DONE]') continue;
            if (payload === '[ERROR]') { aiMsg.content += '（エラー）'; continue; }
            aiMsg.content += JSON.parse(payload);
            grokRender();
          }
        }
        // 最初の発言のときだけ、この会話をDBに作る（＝空の「新しい会話」を量産しない）
        // 1言目をそのままタイトルにするので、一覧で見分けられる
        if (!grokConvId) {
          const { data: created } = await supabase.from('conversations')
            .insert({ user_id: myUserId, title: text.slice(0, 20) }).select('id').single();
          grokConvId = created.id;
          await grokLoadConversations();
        }
        await supabase.from('messages').insert([
          { conversation_id: grokConvId, role: 'user', content: text },
          { conversation_id: grokConvId, role: 'assistant', content: aiMsg.content },
        ]);
        await grokMaybeSummarize();
        await grokExtractFact(text);
      } finally {
        grokSending = false;
        document.getElementById('grokSend').disabled = false;
      }
    }

    async function grokMaybeSummarize() {
      const rest = grokHistory.slice(1);
      const overflow = rest.length - GROK_RECENT;
      if (overflow <= grokSummarizedCount) return;
      const chunk = rest.slice(grokSummarizedCount, overflow)
        .map((m) => (m.role === 'user' ? 'あなた: ' : 'AI: ') + m.content).join('\n');
      const token = await grokToken();
      const res = await fetch(GROK_SERVER + '/api/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ oldSummary: grokSummary, overflowed: chunk }),
      });
      if (!res.ok) return;
      grokSummary = (await res.json()).summary;
      grokSummarizedCount = overflow;
      if (grokConvId) await supabase.from('conversations').update({ summary: grokSummary }).eq('id', grokConvId);
      grokRender();
    }

    async function grokExtractFact(text) {
      const token = await grokToken();
      const res = await fetch(GROK_SERVER + '/api/extract-fact', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) return;
      const { fact } = await res.json();
      if (fact) {
        await supabase.from('memories').insert({ fact });
        grokMemory.push(fact);
        grokRender();
      }
    }

    async function grokLoadConversations() {
      const listEl = document.getElementById('grokConvList');
      const { data: convs } = await supabase.from('conversations')
        .select('id, title, created_at').order('created_at', { ascending: false });
      listEl.innerHTML = '';
      for (const c of (convs || [])) {
        if (c.title === '新しい会話') continue;   // 過去に溜まった空の会話は一覧に出さない
        const b = document.createElement('button');
        b.textContent = c.title || '会話';
        if (c.id === grokConvId) b.classList.add('active');
        b.addEventListener('click', () => grokOpenConversation(c.id));
        listEl.appendChild(b);
      }
    }

    async function grokOpenConversation(id) {
      grokConvId = id;
      const { data: conv } = await supabase.from('conversations').select('summary').eq('id', id).single();
      grokSummary = (conv && conv.summary) || '';
      grokSummarizedCount = 0;
      const { data: rows } = await supabase.from('messages')
        .select('role, content').eq('conversation_id', id).order('created_at', { ascending: true });
      grokHistory = [{ role: 'system', content: GROK_BASE_SYSTEM }];
      for (const r of (rows || [])) grokHistory.push({ role: r.role, content: r.content });
      grokRender();
      await grokLoadConversations();
    }

    async function grokNewConversation() {
      // まだDBには作らない。最初の発言のときにgrokSendが作る（空の会話を量産しないため）
      grokConvId = null;
      grokSummary = '';
      grokSummarizedCount = 0;
      grokHistory = [{ role: 'system', content: GROK_BASE_SYSTEM }];
      grokRender();
      await grokLoadConversations();
    }

    async function grokCleanupEmpty() {
      // 中身のない（メッセージが1件もない）空の会話をDBから消す。
      // 会話id一覧と、実際に使われているconversation_idを突き合わせて、未使用のものを削除。
      const { data: convs } = await supabase.from('conversations').select('id');
      const { data: msgs } = await supabase.from('messages').select('conversation_id');
      const used = new Set((msgs || []).map((m) => m.conversation_id));
      for (const c of (convs || [])) {
        if (!used.has(c.id)) await supabase.from('conversations').delete().eq('id', c.id);
      }
    }

    async function grokInit() {
      if (grokInited || !myUserId) return;
      grokInited = true;
      await grokCleanupEmpty();   // 起動時に空の会話を掃除
      const { data: mem } = await supabase.from('memories').select('fact');
      grokMemory = (mem || []).map((m) => m.fact);
      const { data: convs } = await supabase.from('conversations')
        .select('id, summary').neq('title', '新しい会話')   // 空の会話は開かず、最新の中身ある会話を復元
        .order('created_at', { ascending: false }).limit(1);
      if (convs && convs.length) await grokOpenConversation(convs[0].id);
      else await grokNewConversation();
      document.getElementById('grokSend').addEventListener('click', () => {
        const input = document.getElementById('grokInput');
        const t = input.value;
        input.value = '';
        grokSend(t);
      });
      document.getElementById('grokNew').addEventListener('click', grokNewConversation);
    }

    // ===== AI機能（要約・作文アシスト・人物要約）=====
    // 既存の /api/chat を1回だけ呼び、ストリームを最後まで読んで返答を1つの文字列にする
    async function aiComplete(system, user) {
      const token = await grokToken();
      const res = await fetch(GROK_SERVER + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
        body: JSON.stringify({ messages: [
          { role: 'system', content: system },
          { role: 'user', content: user },
        ] }),
      });
      if (!res.ok) {
        let msg = 'エラー';
        try { msg = (await res.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '', out = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const payload = line.slice(6);
          if (payload === '[DONE]' || payload === '[ERROR]') continue;
          out += JSON.parse(payload);
        }
      }
      return out.trim();
    }

    // ボタンを処理中に無効化し、結果（またはエラー）を出力ボックスに出す小さなヘルパ
    async function aiRun(btn, box, label, fn) {
      if (btn.disabled) return;
      btn.disabled = true;
      if (box) { box.style.display = 'block'; box.textContent = label + '…'; }
      try {
        const out = await fn();
        if (box && out) box.textContent = out;
        return out;
      } catch (e) {
        if (box) box.textContent = '⚠ ' + e.message;
        else alert('AIエラー: ' + e.message);
      } finally {
        btn.disabled = false;
      }
    }

    // --- 機能2: 投稿の下書きAI（入力欄の文章を書き換える）---
    const composeAiPrompts = {
      polish:   ['あなたはSNS投稿の編集者です。意味は変えず、日本語を自然で読みやすく整え、本文だけを返してください。前置きや説明は不要。', '次の投稿を整えて:'],
      continue: ['あなたはSNS投稿のライターです。書きかけの続きを自然に書き足し、投稿の全文だけを返してください。前置きや説明は不要。', '次の書きかけの続きを書いて:'],
      shorten:  ['あなたはSNS投稿の編集者です。140字以内に、要点を残して短くまとめ、本文だけを返してください。前置きや説明は不要。', '次の投稿を短く:'],
      hashtags: ['あなたはSNSの中の人です。内容に合うハッシュタグを3〜5個だけ、半角#つき・スペース区切りで返してください。説明は不要。', '次の投稿に合うハッシュタグ:'],
    };
    document.querySelectorAll('#composeAi button').forEach((btn) => {
      btn.addEventListener('click', () => {
        const ta = document.getElementById('tweetBody');
        const body = ta.value.trim();
        if (!body) { alert('先に投稿を書いてね'); return; }
        const [sys, lead] = composeAiPrompts[btn.dataset.ai];
        return aiRun(btn, null, '', async () => {
          const out = await aiComplete(sys, lead + '\n' + body);
          // ハッシュタグは元の本文に足す。それ以外は本文を置き換える
          ta.value = btn.dataset.ai === 'hashtags' ? body + '\n' + out : out;
          return out;
        });
      });
    });

    // --- 機能1: タイムライン要約「今北産業」---
    document.getElementById('summarizeTlBtn').addEventListener('click', (e) => {
      const btn = e.currentTarget;
      const box = document.getElementById('tlSummary');
      return aiRun(btn, box, '要約中', async () => {
        const { data: ts } = await supabase.from('tweets')
          .select('body, user_id').eq('is_public', true)
          .order('created_at', { ascending: false }).limit(30);
        if (!ts || !ts.length) return 'まだ投稿がありません。';
        const names = await fetchNames(ts.map((t) => t.user_id));
        const text = ts.map((t) => '・' + ((names[t.user_id] && names[t.user_id].name) || '誰か') + ': ' + t.body).join('\n');
        return aiComplete(
          'あなたはSNSのまとめ役です。タイムラインを話題ごとに、3行以内で「今北産業（＝今北の人に3行で状況説明）」風に要約してください。',
          '今のタイムライン:\n' + text);
      });
    });

    // 最初に一覧を表示
    await loadTweets();
    await loadUsers();
    await loadHome();
    await loadMyTweets();
  </script>
</body>
</html>
